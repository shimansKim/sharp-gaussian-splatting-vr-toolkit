# 사용자 사이트에 정책·지원·다운로드 페이지를 배포한다.
# pull_request에서는 파일만 확인하고 배포하지 않는다.

name: store site deploy

on:
  push:
    branches: [main]
    paths:
      - "store-site/**"
      - ".github/workflows/store-deploy.yml"
  pull_request:
    paths:
      - "store-site/**"
      - ".github/workflows/store-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-deploy-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  USER_SITE_REPO: crayonsmilegames/crayonsmilegames.github.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check site files
        run: |
          test -f store-site/sharp-quest/download/index.html

      - name: Check deploy key
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.CRAYON_SITE_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::저장소 시크릿 CRAYON_SITE_DEPLOY_KEY가 없습니다. 사용자 사이트에 배포할 수 없습니다."
            exit 1
          fi

      - name: Checkout user site
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.USER_SITE_REPO }}
          ref: main
          ssh-key: ${{ secrets.CRAYON_SITE_DEPLOY_KEY }}
          path: user-site

      - name: Sync files
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p user-site/sharp-quest
          rsync -a --delete store-site/sharp-quest/ user-site/sharp-quest/

      - name: Push to user site
        if: github.event_name != 'pull_request'
        working-directory: user-site
        run: |
          git add -A -- sharp-quest/
          if git diff --cached --quiet; then
            echo "바뀐 파일이 없어 푸시하지 않습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "deploy: 사용자 사이트 파일 (source ${GITHUB_SHA::7})"
          # pc-server.yml도 main에 /downloads/를 쓰므로, 겹치면 받아서 다시 올린다.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull -q --rebase origin main
          done
          exit 1
