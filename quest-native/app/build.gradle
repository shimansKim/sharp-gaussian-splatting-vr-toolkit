plugins {
    id "com.android.application"
}

def qnBuildRoot = System.getenv("QN_BUILD_ROOT")

android {
    // Not ".native": "native" is a Java keyword and breaks the generated namespace.
    namespace "com.sharp.questnative"
    // 36: Media3 1.11 requires compileSdk 36 (targetSdk stays 32).
    compileSdk 36
    ndkVersion "28.1.13356709"

    defaultConfig {
        applicationId "com.sharp.questnative"
        minSdk 32
        targetSdk 32
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            // Until a release keystore exists, release is signed with the debug key (sideload only).
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
            if (qnBuildRoot) {
                buildStagingDirectory new File(qnBuildRoot, "cxx")
            }
        }
    }

    buildFeatures { prefab true }

    // Quest apps target API 32 (Meta guidance); the Play-only lint rule does not apply.
    lint { disable "ExpiredTargetSdkVersion" }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Khronos OpenXR loader (Apache-2.0), prefab AAR from Maven Central.
    implementation "org.khronos.openxr:openxr_loader_for_android:1.1.65"
    // Video decoding into the OpenXR Surface swapchain (Apache-2.0). Owner: video.
    implementation "androidx.media3:media3-exoplayer:1.11.1"

    // JVM unit tests only (not in the APK): FormatDetect / SpatialMeta.
    testImplementation "junit:junit:4.13.2"
    // JVM unit tests only: real org.json for source/PcApi (the APK uses Android's built-in org.json).
    testImplementation "org.json:json:20240303"
}

// Open-source notices (docs/licenses.md 6-7). One source of truth:
//  - qnCopyLicenses copies docs/licenses.md, docs/license-texts/* and every cpp/*/third_party/*/LICENSE*
//    (verbatim, with the copyright lines) into assets/licenses; the in-app notice screen shows them.
//  - qnCheckLicenses fails the build when the APK's runtime libraries, the third_party folders or the
//    license texts differ from the inventory block in docs/licenses.md (section 7).
def qnDocsDir = rootProject.file("docs")
def qnCppDir = file("src/main/cpp")
def qnThirdPartyDirs = {
    def out = []
    qnCppDir.listFiles().findAll { it.isDirectory() }.sort { it.name }.each { m ->
        def tp = new File(m, "third_party")
        if (tp.isDirectory()) tp.listFiles().findAll { it.isDirectory() }.sort { it.name }.each { out << it }
    }
    out
}
def qnLicensesDir = layout.buildDirectory.dir("generated/qn-licenses")
def qnCopyLicenses = tasks.register("qnCopyLicenses", Sync) {
    from(new File(qnDocsDir, "licenses.md"))
    from(new File(qnDocsDir, "license-texts")) { into("texts") }
    qnThirdPartyDirs().each { d ->
        from(d) {
            include("LICENSE*", "NOTICE*")
            into("third_party")
            rename { n -> "${d.parentFile.parentFile.name}-${d.name}-${n}" }
        }
    }
    into(qnLicensesDir.map { it.dir("licenses") })
}
def qnCheckLicenses = tasks.register("qnCheckLicenses") {
    group = "verification"
    description = "Checks docs/licenses.md section 7 against runtime libraries, third_party folders and license texts."
    doLast {
        def md = new File(qnDocsDir, "licenses.md").getText("UTF-8").replace("\r\n", "\n")
        def m = (md =~ /(?s)<!-- qn-license-inventory -->\s*```text\n(.*?)```/)
        if (!m.find()) throw new GradleException("docs/licenses.md: inventory block (<!-- qn-license-inventory -->) not found")
        def listed = [maven: [] as Set, native: [] as Set, own: [] as Set, text: [] as Set]
        m.group(1).readLines()*.trim().findAll { it && !it.startsWith("#") }.each { line ->
            def parts = line.split(/\s+/, 2)
            if (parts.length != 2 || !listed.containsKey(parts[0])) {
                throw new GradleException("docs/licenses.md section 7: bad line '" + line + "'")
            }
            listed[parts[0]] << parts[1]
        }
        def errors = []
        def actualMaven = configurations.getByName("releaseRuntimeClasspath").incoming.resolutionResult.allComponents
                .findAll { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                .collect { "${it.moduleVersion.group}:${it.moduleVersion.name}".toString() } as Set
        (actualMaven - listed.maven).sort().each { errors << "runtime library not in licenses.md: maven " + it }
        (listed.maven - actualMaven).sort().each { errors << "licenses.md lists a library the APK does not use: maven " + it }
        def dirs = qnThirdPartyDirs().collect { "${it.parentFile.parentFile.name}/${it.name}".toString() } as Set
        def listedDirs = listed.native + listed.own
        (dirs - listedDirs).sort().each { errors << "third_party folder not in licenses.md: " + it }
        (listedDirs - dirs).sort().each { errors << "licenses.md lists a missing third_party folder: " + it }
        listed.native.each { rel ->
            def d = new File(qnCppDir, rel.replace("/", "/third_party/"))
            if (d.isDirectory() && !d.listFiles().any { it.name.toUpperCase().startsWith("LICENSE") }) {
                errors << "third_party folder without a LICENSE file: " + rel
            }
        }
        def texts = (new File(qnDocsDir, "license-texts").listFiles() ?: []).collect { it.name } as Set
        (texts - listed.text).sort().each { errors << "license text not in licenses.md: " + it }
        (listed.text - texts).sort().each { errors << "licenses.md lists a missing license text: " + it }
        if (!errors.isEmpty()) {
            throw new GradleException("Open-source notice check failed (docs/licenses.md section 7):\n  " + errors.join("\n  "))
        }
        println("qnCheckLicenses: OK (" + actualMaven.size() + " runtime libraries, " + dirs.size() +
                " third_party folders, " + texts.size() + " license texts)")
    }
}
android.sourceSets.main.assets.srcDir(qnLicensesDir)
tasks.named("preBuild") { dependsOn(qnCheckLicenses, qnCopyLicenses) }
