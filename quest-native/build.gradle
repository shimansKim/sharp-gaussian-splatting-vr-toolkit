plugins {
    id "com.android.application" version "8.13.0" apply false
}

// Build outputs go outside the repo: build.bat sets QN_BUILD_ROOT (default %LOCALAPPDATA%\sharp-quest-native\build).
def qnBuildRoot = System.getenv("QN_BUILD_ROOT")
if (qnBuildRoot) {
    allprojects { p ->
        p.layout.buildDirectory.set(new File(qnBuildRoot, p.name))
    }
}
