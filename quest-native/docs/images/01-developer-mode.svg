<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <title>개발자 모드 켜기(도식)</title>
  <rect width="760" height="360" fill="#f6f7fb"/>
  <!-- phone -->
  <rect x="40" y="20" width="200" height="320" rx="26" fill="#22262e"/>
  <rect x="52" y="44" width="176" height="272" rx="8" fill="#ffffff"/>
  <text x="140" y="70" font-size="14" text-anchor="middle" fill="#22262e" font-weight="bold">Meta Horizon 앱</text>
  <rect x="64" y="86" width="152" height="34" rx="6" fill="#e8ecf6"/>
  <text x="76" y="108" font-size="13" fill="#22262e">① 기기(Devices)</text>
  <rect x="64" y="128" width="152" height="34" rx="6" fill="#e8ecf6"/>
  <text x="76" y="150" font-size="13" fill="#22262e">② 헤드셋 설정</text>
  <rect x="64" y="170" width="152" height="34" rx="6" fill="#e8ecf6"/>
  <text x="76" y="192" font-size="13" fill="#22262e">③ 개발자 모드</text>
  <rect x="64" y="226" width="152" height="46" rx="6" fill="#ffffff" stroke="#4c84ff" stroke-width="2"/>
  <text x="76" y="254" font-size="13" fill="#22262e">개발자 모드</text>
  <rect x="164" y="238" width="40" height="22" rx="11" fill="#4c84ff"/>
  <circle cx="193" cy="249" r="8" fill="#ffffff"/>
  <!-- arrow -->
  <path d="M262 180 L330 180" stroke="#4c84ff" stroke-width="4" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4c84ff"/></marker></defs>
  <!-- headset -->
  <rect x="360" y="120" width="250" height="120" rx="48" fill="#ffffff" stroke="#22262e" stroke-width="4"/>
  <rect x="390" y="148" width="80" height="60" rx="24" fill="#22262e"/>
  <rect x="500" y="148" width="80" height="60" rx="24" fill="#22262e"/>
  <text x="485" y="270" font-size="15" text-anchor="middle" fill="#22262e">④ 헤드셋을 껐다 켭니다</text>
  <text x="380" y="40" font-size="16" fill="#22262e" font-weight="bold">처음 한 번만 하면 됩니다</text>
  <text x="380" y="64" font-size="13" fill="#5a6273">· Meta 개발자 계정(무료)이 필요할 수 있습니다</text>
  <text x="380" y="86" font-size="13" fill="#5a6273">· 메뉴 이름은 앱 버전에 따라 다를 수 있습니다 [추정]</text>
  <text x="380" y="320" font-size="12" fill="#8a91a0">도식입니다. 실제 화면과 다를 수 있습니다.</text>
</svg>
