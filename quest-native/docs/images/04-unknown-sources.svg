<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <title>헤드셋 앱 목록에서 알 수 없는 출처(도식)</title>
  <rect width="760" height="320" fill="#f6f7fb"/>
  <rect x="30" y="20" width="700" height="250" rx="18" fill="#1b1f27"/>
  <text x="56" y="56" font-size="16" fill="#ffffff" font-weight="bold">앱 라이브러리</text>
  <rect x="520" y="36" width="180" height="32" rx="8" fill="#2c3340" stroke="#4c84ff" stroke-width="2"/>
  <text x="536" y="58" font-size="13" fill="#ffffff">① 모든 앱 ▾</text>
  <rect x="520" y="74" width="180" height="96" rx="8" fill="#2c3340"/>
  <text x="536" y="98" font-size="13" fill="#c7cede">모든 앱</text>
  <text x="536" y="122" font-size="13" fill="#c7cede">설치됨</text>
  <rect x="528" y="132" width="164" height="30" rx="6" fill="#4c84ff"/>
  <text x="536" y="152" font-size="13" fill="#ffffff">② 알 수 없는 출처</text>
  <rect x="56" y="96" width="130" height="130" rx="14" fill="#2c3340" stroke="#4c84ff" stroke-width="3"/>
  <text x="121" y="150" font-size="13" text-anchor="middle" fill="#ffffff">SHARP</text>
  <text x="121" y="170" font-size="13" text-anchor="middle" fill="#ffffff">VR Native</text>
  <text x="121" y="250" font-size="13" text-anchor="middle" fill="#ffffff">③ 눌러서 실행</text>
  <rect x="206" y="96" width="130" height="130" rx="14" fill="#2c3340"/>
  <rect x="356" y="96" width="130" height="130" rx="14" fill="#2c3340"/>
  <text x="30" y="300" font-size="12" fill="#8a91a0">도식입니다. 필터 이름과 위치는 헤드셋 OS 버전에 따라 다를 수 있습니다 [추정].</text>
</svg>
