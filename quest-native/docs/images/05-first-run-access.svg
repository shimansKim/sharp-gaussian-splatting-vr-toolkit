<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <title>처음 실행 때 파일 접근 허용(도식)</title>
  <rect width="760" height="340" fill="#f6f7fb"/>
  <rect x="30" y="20" width="700" height="270" rx="18" fill="#161a22"/>
  <text x="56" y="56" font-size="18" fill="#ffffff" font-weight="bold">파일</text>
  <rect x="56" y="76" width="200" height="190" rx="8" fill="#1f2430"/>
  <text x="70" y="104" font-size="14" fill="#ffffff">최근</text>
  <text x="70" y="132" font-size="14" fill="#ffffff">보관함</text>
  <rect x="62" y="144" width="188" height="30" rx="6" fill="#2e5cbe"/>
  <text x="70" y="165" font-size="14" fill="#ffffff">▾ 이 기기</text>
  <text x="70" y="196" font-size="14" fill="#ffffff">▸ PC</text>
  <text x="280" y="104" font-size="16" fill="#ffffff" font-weight="bold">기기 파일을 보려면 접근을 허용하세요</text>
  <text x="280" y="132" font-size="13" fill="#9aa3b2">폴더 고르기: 고른 폴더만 봅니다(권장)</text>
  <text x="280" y="152" font-size="13" fill="#9aa3b2">모든 파일 접근: 저장소 전체를 봅니다(설정 화면이 열려요)</text>
  <rect x="280" y="176" width="200" height="50" rx="10" fill="#4c84ff"/>
  <text x="380" y="207" font-size="15" text-anchor="middle" fill="#ffffff">폴더 고르기</text>
  <rect x="496" y="176" width="200" height="50" rx="10" fill="#2a313e"/>
  <text x="596" y="207" font-size="15" text-anchor="middle" fill="#ffffff">모든 파일 접근</text>
  <text x="280" y="252" font-size="12" fill="#9aa3b2">누르면 잠시 2D 창으로 바뀌었다가 앱으로 돌아옵니다</text>
  <text x="30" y="318" font-size="12" fill="#8a91a0">앱 화면을 본뜬 도식입니다(코드의 배치 기준). 실기기 화면은 아직 확인하지 못했습니다.</text>
</svg>
