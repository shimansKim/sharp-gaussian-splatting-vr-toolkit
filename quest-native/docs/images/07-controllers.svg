<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <title>기본 조작(도식)</title>
  <rect width="760" height="460" fill="#f6f7fb"/>
  <text x="30" y="36" font-size="15" fill="#22262e" font-weight="bold">어디서나(기본 배정, [설정] → [버튼 바꾸기]에서 바꿀 수 있음)</text>
  <text x="30" y="62" font-size="13" fill="#22262e">· 패널을 가리키고 트리거: 누르기 · 누른 채 끌기: 막대·목록 끌기 · 스틱 위아래: 목록 스크롤</text>
  <text x="30" y="84" font-size="13" fill="#22262e">· 패널 밖에서 오른쪽 트리거: 재생 컨트롤 보이기·숨기기</text>
  <!-- left controller -->
  <ellipse cx="190" cy="190" rx="78" ry="66" fill="#ffffff" stroke="#22262e" stroke-width="4"/>
  <circle cx="160" cy="180" r="18" fill="#22262e"/><text x="160" y="185" font-size="11" text-anchor="middle" fill="#ffffff">스틱</text>
  <circle cx="208" cy="168" r="12" fill="#5a6273"/><text x="208" y="172" font-size="11" text-anchor="middle" fill="#ffffff">Y</text>
  <circle cx="218" cy="200" r="12" fill="#5a6273"/><text x="218" y="204" font-size="11" text-anchor="middle" fill="#ffffff">X</text>
  <text x="190" y="280" font-size="14" text-anchor="middle" fill="#22262e" font-weight="bold">왼손</text>
  <text x="40" y="304" font-size="12" fill="#22262e">Y 짧게: UI 켜기·끄기 · 길게: UI 옮기기</text>
  <text x="40" y="324" font-size="12" fill="#22262e">X 짧게: 이전 파일 · 길게: 다음 파일</text>
  <!-- right controller -->
  <ellipse cx="570" cy="190" rx="78" ry="66" fill="#ffffff" stroke="#22262e" stroke-width="4"/>
  <circle cx="600" cy="180" r="18" fill="#22262e"/><text x="600" y="185" font-size="11" text-anchor="middle" fill="#ffffff">스틱</text>
  <circle cx="552" cy="168" r="12" fill="#5a6273"/><text x="552" y="172" font-size="11" text-anchor="middle" fill="#ffffff">B</text>
  <circle cx="542" cy="200" r="12" fill="#5a6273"/><text x="542" y="204" font-size="11" text-anchor="middle" fill="#ffffff">A</text>
  <text x="570" y="280" font-size="14" text-anchor="middle" fill="#22262e" font-weight="bold">오른손</text>
  <text x="430" y="304" font-size="12" fill="#22262e">B 짧게: UI 켜기·끄기 · 길게: UI 옮기기</text>
  <text x="430" y="324" font-size="12" fill="#22262e">A: 파일 목록 열기·닫기</text>
  <!-- per viewer -->
  <text x="30" y="366" font-size="14" fill="#22262e" font-weight="bold">PLY</text>
  <text x="80" y="366" font-size="12" fill="#5a6273">그립: 잡아 옮기기 · 양손 그립: 크기 · 왼스틱: 이동 · 오른스틱: 회전·높이 · 오른스틱 누름: 맞춤</text>
  <text x="30" y="392" font-size="14" fill="#22262e" font-weight="bold">영상</text>
  <text x="80" y="392" font-size="12" fill="#5a6273">오른스틱 좌우: 10초 · 위아래: 크기 · 왼스틱 위아래: 음량 · 왼쪽 트리거: 배속 · 왼스틱 누름: 정면</text>
  <text x="30" y="418" font-size="14" fill="#22262e" font-weight="bold">사진</text>
  <text x="80" y="418" font-size="12" fill="#5a6273">왼스틱: 돌리기 · 오른스틱 위아래: 줌 · 오른스틱 누름: 줌 처음 크기 · 왼스틱 누름: 정면</text>
  <text x="30" y="446" font-size="11" fill="#8a91a0">도식입니다. 버튼 위치는 컨트롤러 모양을 단순하게 그렸습니다.</text>
</svg>
